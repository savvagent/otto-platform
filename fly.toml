# otto-platform on Fly.io, org "savvagent".
#
# Database: `otto_platform` on `otto-db` (region iad), a single unmanaged Fly
# Postgres app shared with otto-factory, which uses its own `otto_factory`
# database there. Separate databases, one machine — chosen for cost while all
# data is disposable. The trade-off: `fly postgres attach` makes each app's
# role a superuser on that instance, so either app's credential can reach the
# other's database. Split onto dedicated instances before real customers.
#
# Unmanaged rather than the managed `savvagent-pg` cluster because
# 0004_rls.sql runs `CREATE ROLE otto_app NOLOGIN`, which needs CREATEROLE,
# and the managed cluster does not grant it (see otto-factory
# docs/deploy/fly.md). The connecting role bypasses RLS as a superuser:
# isolation rests on `Db::begin` issuing `SET LOCAL ROLE otto_app`, which the
# startup isolation check verifies.
#
# Secrets are NOT in this file. `fly postgres attach` stages DATABASE_URL, and
# SAVVAGENT_ENCRYPTION_KEY (32 random bytes, base64: `openssl rand -base64 32`) must
# be staged by hand with `fly secrets set -a otto-platform`. The server refuses
# to start without it, which is the point: a deploy that cannot encrypt SSO
# secrets should fail its health check rather than limp. The optional
# secrets (SAVVAGENT_SMTP_URL with SAVVAGENT_EMAIL_FROM, set together or not at all) are
# listed in docs/deploy/fly.md.
#
# Hostname: since the Savvagent cutover (savvagent/otto-platform#131) the
# console and the OAuth issuer are at savvagent.com, served straight from this
# app (DNS at Namecheap points at Fly; `fly certs add savvagent.com -a
# otto-platform`; see docs/deploy/fly.md). SAVVAGENT_PUBLIC_URL below says so,
# and its host is the WebAuthn relying party id, so passkeys only work when the
# browser is actually on that host: neither otto-platform.fly.dev nor the old
# otto.savvagent.com can complete a passkey ceremony. otto.savvagent.com still
# points at this app and keeps answering resource servers' introspection and
# token calls until every service has moved (savvagent/otto-platform#135).
# Changing the host again invalidates every passkey; the cutover runbook in
# docs/deploy/fly.md is how this one was done.

app = "otto-platform"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Fly's proxy terminates TLS and forwards plain HTTP over the internal network.
  SAVVAGENT_BIND = "0.0.0.0:8080"
  SAVVAGENT_LOG_FORMAT = "json"
  RUST_LOG = "info"
  # The origin browsers see; also fixes the WebAuthn relying party id (its host).
  SAVVAGENT_PUBLIC_URL = "https://savvagent.com"
  # Fly's proxy overwrites this header with the real client address (it does
  # not append, unlike X-Forwarded-For), which is the only property that makes
  # a per-IP throttle keyed on it worth anything. Nothing sits in front of Fly:
  # savvagent.com (and otto.savvagent.com) resolve straight to this app, so no
  # edge can rewrite it.
  # (Behind the optional Cloudflare Worker this would have to be
  # `cf-connecting-ip`; see docs/deploy/cloudflare.md.)
  SAVVAGENT_CLIENT_IP_HEADER = "fly-client-ip"
  # This process serves the console itself, the way otto-factory does: the image
  # carries the built bundle at /srv/console: prerendered pages as themselves,
  # and the SPA shell (200.html, which the bundle must contain or the server
  # refuses to start) with X-Robots-Tag: noindex for client-side routes. Unknown
  # /api, /oauth, /sso, /.well-known and /internal paths still answer a JSON 404.
  SAVVAGENT_STATIC_DIR = "/srv/console"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  # Every otto-* service's logins and token checks go through this app, and
  # `fly ssh console` (used to run `resource register`) fails against a stopped
  # machine, so it never stops. One machine for now; see `fly scale count`.
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    # /readyz, not /healthz: this check decides whether traffic is routed
    # here, which is the question readiness answers.
    path = "/readyz"
    method = "GET"
    interval = "15s"
    timeout = "5s"
    # Migrations run at startup under an advisory lock, so a first boot against
    # a fresh database has DDL to get through before it can answer.
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
