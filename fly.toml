# otto-platform on Fly.io, org "savvagent".
#
# Database: `otto_platform` on `otto-db` (region iad), a single unmanaged Fly
# Postgres app shared with otto-factory, which uses its own `otto_factory`
# database there. Separate databases, one machine — chosen for cost while all
# data is disposable. The trade-off: `fly postgres attach` makes each app's
# role a superuser on that instance, so either app's credential can reach the
# other's database. Split onto dedicated instances before real customers.
#
# Unmanaged rather than the managed `savvagent-pg` cluster because
# 0004_rls.sql runs `CREATE ROLE otto_app NOLOGIN`, which needs CREATEROLE,
# and the managed cluster does not grant it (see otto-factory
# docs/deploy/fly.md). The connecting role bypasses RLS as a superuser:
# isolation rests on `Db::begin` issuing `SET LOCAL ROLE otto_app`, which the
# startup isolation check verifies.
#
# Secrets are NOT in this file. `fly postgres attach` stages DATABASE_URL, and
# OTTO_ENCRYPTION_KEY (32 random bytes, base64: `openssl rand -base64 32`) must
# be staged by hand with `fly secrets set -a otto-platform`. The server refuses
# to start without it, which is the point: a deploy that cannot encrypt SSO
# secrets should fail its health check rather than limp.
#
# Hostname: Phase 4 of docs/plans/2026-10-06-platform-cutover.md serves the
# console at otto.savvagent.com, and OTTO_PUBLIC_URL below says so. Its host is
# the WebAuthn relying party id, so passkeys only work when the browser is
# actually on that host: otto-platform.fly.dev serves the API to resource
# servers and health checks but cannot complete a passkey ceremony. A Cloudflare
# Worker owns the public hostname and proxies here (docs/deploy/cloudflare.md),
# so no `fly certs add` is needed for it. Settle the hostname before anyone
# registers a passkey: changing it later invalidates every one.

app = "otto-platform"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Fly's proxy terminates TLS and forwards plain HTTP over the internal network.
  OTTO_BIND = "0.0.0.0:8080"
  OTTO_LOG_FORMAT = "json"
  RUST_LOG = "info"
  # The origin browsers see; also fixes the WebAuthn relying party id (its host).
  OTTO_PUBLIC_URL = "https://otto.savvagent.com"
  # The console is served by a Cloudflare Worker at otto.savvagent.com that
  # proxies to this app (web/worker, docs/deploy/cloudflare.md). Behind it,
  # Fly's own `fly-client-ip` is the address of a Cloudflare egress node, so
  # every per-IP throttle (signup, login, claim) would count all of Cloudflare as
  # one caller. Cloudflare overwrites `cf-connecting-ip` before the Worker runs
  # and the Worker forwards it unchanged, so that is the header to key on.
  #
  # TRUST: this is only sound while the origin cannot be reached except through
  # Cloudflare. A caller hitting otto-platform.fly.dev directly sets this header
  # itself. The resource servers that call /oauth/introspect and /internal/* do
  # reach it directly, but neither route reads the client address. Lock the
  # origin down (docs/deploy/cloudflare.md, "Trap 2") before relying on the
  # throttles against a determined attacker. To go back to `fly-client-ip`
  # (e.g. no Worker in front), change it here and nowhere else.
  OTTO_CLIENT_IP_HEADER = "cf-connecting-ip"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  # Nothing depends on this service yet, so let it stop when idle. Revisit in
  # Phase 4, when every otto-* service's logins and token checks go through it.
  auto_stop_machines = "stop"
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    # /readyz, not /healthz: this check decides whether traffic is routed
    # here, which is the question readiness answers.
    path = "/readyz"
    method = "GET"
    interval = "15s"
    timeout = "5s"
    # Migrations run at startup under an advisory lock, so a first boot against
    # a fresh database has DDL to get through before it can answer.
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
