[workspace]
resolver = "2"
members = [
  "crates/savvagent-tenant",
  "crates/savvagent-core",
  "crates/savvagent-billing",
  "crates/savvagent-auth",
  "crates/savvagent-web",
  "crates/savvagent-resource",
  "crates/savvagent-client",
  "crates/savvagent-ctl",
  "crates/savvagent-flags-cli",
  "crates/savvagent-platform-server",
]

[workspace.package]
version = "0.18.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
savvagent-tenant = { path = "crates/savvagent-tenant" }
savvagent-core = { path = "crates/savvagent-core" }
savvagent-billing = { path = "crates/savvagent-billing" }
savvagent-auth = { path = "crates/savvagent-auth" }
savvagent-web = { path = "crates/savvagent-web" }
savvagent-resource = { path = "crates/savvagent-resource" }
savvagent-client = { path = "crates/savvagent-client" }

sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "macros", "migrate", "json",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "net"] }
axum = "0.8"
http = "1"
tower-http = "0.6"
tower = { version = "0.5", features = ["util"] }
schemars = { version = "1.1", features = ["chrono04", "uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
# Only used by savvagent-core's labels.rs test module (asserting the generated
# handle's shape). Not a runtime dependency of any crate in this workspace.
regex = "1"
url = "2"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
# Loads .env for local runs. Never overrides a variable already set, so a
# deployment's real environment always wins over a file that got shipped.
dotenvy = "0.15"
aes-gcm = "0.10"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# SMTP for notification email. rustls with ring and webpki roots, like reqwest
# above: no OpenSSL from this crate, so the image needs nothing new. No `pool`
# feature: a pooled connection whose send is cancelled by our deadline goes
# back to the pool with a reply still in flight, and the next message reads
# that reply as its own. One connection per send closes with its future.
lettre = { version = "0.11", default-features = false, features = [
  "smtp-transport", "hostname", "builder", "tokio1-rustls", "ring", "webpki-roots",
] }
jsonwebtoken = "9"
hickory-resolver = "0.26"

[profile.release]
lto = "thin"
strip = true
