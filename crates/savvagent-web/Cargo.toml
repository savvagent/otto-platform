[package]
name = "savvagent-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
savvagent-tenant.workspace = true
savvagent-core.workspace = true
savvagent-auth.workspace = true
savvagent-billing.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
axum.workspace = true
http.workspace = true
url.workspace = true
base64.workspace = true
sha2.workspace = true
anyhow.workspace = true
schemars.workspace = true
# `sync` for the plan catalog's in-process cache (`routes::plans::PlansCache`).
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
# Integration tests link savvagent-web as an external crate, so anything they name
# directly has to be declared here too.
# `test-util` for the plan cache's paused-clock tests.
tokio = { workspace = true, features = ["full", "test-util"] }
# test-support relaxes savvagent-auth::oidc's SSRF guard for loopback addresses
# only, so this crate's own mock-IdP tests (tests/sso.rs) can run against a
# local server — never enabled by the production dependency above. See that
# feature's doc comment in crates/savvagent-auth/Cargo.toml.
savvagent-auth = { workspace = true, features = ["test-support"] }
# test-support compiles `savvagent_billing::billing::mock`, the local Stripe stand-in
# tests/billing.rs runs the card-on-file flow and the webhook against.
savvagent-billing = { workspace = true, features = ["test-support"] }
jsonwebtoken.workspace = true
# `ServiceExt::oneshot`, for driving the assembled router without binding a port.
tower = { workspace = true, features = ["util"] }
webauthn-authenticator-rs = { version = "0.5.4", default-features = false, features = ["softtoken"] }
webauthn-rs = { version = "0.5.4", features = ["danger-allow-state-serialisation", "resident-key-support", "conditional-ui"] }
webauthn-rs-proto = "0.5.5"
