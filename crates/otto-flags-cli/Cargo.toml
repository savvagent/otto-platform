[package]
name = "otto-flags-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
# Follows otto-client.
rust-version = "1.89"
description = "The `otto-flags` binary behind `ottoctl flags`: issue Otto Flags app keys from a terminal, so the secret server key reaches a person and never a model."

[[bin]]
name = "otto-flags"
path = "src/main.rs"

[dependencies]
otto-client.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["full"] }
tempfile = "3"
