[package]
name = "savvagent-client"
version.workspace = true
edition.workspace = true
license.workspace = true
# std::fs::File::lock / try_lock, stable since 1.89.
rust-version = "1.89"
description = "Client side of savvagent-auth for terminal tools: MCP-style OAuth login (dynamic registration, PKCE S256, loopback redirect), a per-resource token cache, and secret output that never reaches logs. No database dependency."

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
base64.workspace = true
rand.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "time", "rt", "sync", "macros"] }

[target.'cfg(windows)'.dependencies]
# Owner-only DACLs on the files and directory that hold credentials.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
axum.workspace = true
tempfile = "3"
