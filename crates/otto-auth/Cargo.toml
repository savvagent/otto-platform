[package]
name = "otto-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
otto-tenant.workspace = true
otto-core.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
base64.workspace = true
rand.workspace = true
sha2.workspace = true
subtle.workspace = true
webauthn-rs = { version = "0.5.4", features = ["danger-allow-state-serialisation", "resident-key-support", "conditional-ui"] }
webauthn-rs-proto = "0.5.5"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
webauthn-authenticator-rs = { version = "0.5.4", default-features = false, features = ["softtoken"] }
